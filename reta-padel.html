<title>Retas de Padel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: panel de configuración a la izquierda, rondas y tabla a la derecha; una columna en móvil */
:root {
  --bg: #e9f4fb;
  --surface: #fafdff;
  --sunk: #d6e9f5;
  --fg: #0f2740;
  --muted: #55738c;
  --line: #bcd7e8;
  --accent: #2d62c4;
  --accent-fg: #ffffff;
  --accent-soft: #d3e4f9;
  --warm: #0b7f95;
  --warm-soft: #cdeef2;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1a2b; --surface: #112338; --sunk: #08121f; --fg: #e6f2fb; --muted: #8fabc2;
    --line: #223a54; --accent: #7aa3ee; --accent-fg: #0b1a2b; --accent-soft: #1d3558;
    --warm: #4fcbdc; --warm-soft: #14404b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1a2b; --surface: #112338; --sunk: #08121f; --fg: #e6f2fb; --muted: #8fabc2;
  --line: #223a54; --accent: #7aa3ee; --accent-fg: #0b1a2b; --accent-soft: #1d3558;
  --warm: #4fcbdc; --warm-soft: #14404b; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 28px 56px; }
.wrap { max-width: 1080px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; }
h1 span { color: var(--accent); }
.lead { color: var(--muted); margin: 8px 0 0; max-width: 52ch; }
header { margin-bottom: 28px; }
.grid { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
input[type=number], input[type=text], input[type=time] {
  font: inherit; font-size: 15px; letter-spacing: 0; text-transform: none; font-weight: 500;
  color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0;
}
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.names h2 { font-size: 15px; margin-bottom: 4px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
.name-list { display: flex; flex-direction: column; gap: 6px; max-height: 340px; overflow-y: auto; padding-right: 2px; }
.name-row { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: center; }
.name-row i { font-style: normal; font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-direction: column; gap: 8px; }
button { font: inherit; font-weight: 700; border-radius: 10px; padding: 11px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:hover { filter: brightness(0.96); }
.note { font-size: 13px; color: var(--warm); background: var(--warm-soft); border-radius: 8px; padding: 8px 10px; margin: 0; }
.note[hidden] { display: none; }
.results { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-title h2 { font-size: 1.35rem; }
.sec-title small { color: var(--muted); }
.pairs { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--accent-soft); color: var(--fg); border-radius: 999px; padding: 6px 14px; font-weight: 500; }
.chip b { color: var(--accent); margin-right: 6px; font-variant-numeric: tabular-nums; }
.chip.rest { background: var(--warm-soft); }
.turn { margin-bottom: 18px; }
.turn h3 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; font-family: var(--font-body); font-weight: 700; display: flex; gap: 10px; flex-wrap: wrap; }
.turn h3 em { font-style: normal; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--warm); }
.matches { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
.match { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.court { font-size: 12px; font-weight: 700; color: var(--warm); letter-spacing: 0.06em; text-transform: uppercase; }
.side { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 10px; align-items: center; padding: 4px 6px; border-radius: 8px; }
.side span { overflow-wrap: anywhere; font-weight: 500; }
.side.win { background: var(--accent-soft); }
.side.win span { font-weight: 700; }
.side input { text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; padding: 7px 4px; }
.table-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 460px; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 12px; text-align: center; border-bottom: 1px solid var(--line); }
th { font-size: 11.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); background: var(--sunk); }
th:nth-child(2), td:nth-child(2) { text-align: left; width: 100%; }
tr:last-child td { border-bottom: 0; }
td.pos { font-family: var(--font-display); font-weight: 800; color: var(--warm); }
tr.lead-row td { font-weight: 700; }
tr.lead-row td.pos { color: var(--accent); }
.empty { color: var(--muted); padding: 24px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; }
.theme-note { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
@media (prefers-reduced-motion: no-preference) { .match { transition: border-color .15s; } .match:hover { border-color: var(--accent); } }
</style>

<div class="wrap">
  <header>
    <h1>Retas de <span>Padel</span></h1>
    <p class="lead">Escribe a tus retadoras, arma las parejas al azar y reparte los partidos por cancha. Anota los resultados y la tabla se actualiza sola.</p>
  </header>

  <div class="grid">
    <section class="panel" aria-label="Configuración">
      <div class="fields">
        <label for="f-people">Personas
          <input type="number" id="f-people" min="2" max="40" inputmode="numeric">
        </label>
        <label for="f-pairs">Parejas
          <input type="number" id="f-pairs" min="2" max="20" inputmode="numeric">
        </label>
        <label for="f-courts">Canchas
          <input type="number" id="f-courts" min="1" max="10" inputmode="numeric">
        </label>
        <label for="f-points">Puntos por partido
          <input type="number" id="f-points" min="1" max="99" inputmode="numeric">
        </label>
        <label for="f-total">Duración total (min)
          <input type="number" id="f-total" min="20" max="360" step="5" inputmode="numeric">
        </label>
        <label for="f-match">Min. por partido
          <input type="number" id="f-match" min="5" max="90" step="5" inputmode="numeric">
        </label>
        <label for="f-start" style="grid-column: 1 / -1">Hora de inicio
          <input type="time" id="f-start">
        </label>
      </div>
      <p class="note" id="note" hidden></p>
      <div class="names">
        <h2>Jugadoras</h2>
        <p class="hint" id="names-hint">Nombres de ejemplo: cámbialos por los de tu grupo.</p>
        <div class="name-list" id="name-list"></div>
      </div>
      <div class="actions">
        <button class="primary" id="b-gen" type="button">Generar reta</button>
        <button id="b-shuffle" type="button">Mezclar parejas de nuevo</button>
        <button id="b-clear" type="button">Borrar resultados</button>
      </div>
    </section>

    <div class="results" id="results" aria-live="polite"></div>
  </div>
</div>

<script>
(function () {
  var KEY = "reta-padel-v1";
  var SAMPLE = ["Ana", "Bea", "Carla", "Dani", "Elena", "Flor", "Gaby", "Helena"];
  var S = { people: 8, pairsN: 4, courts: 2, points: 21, total: 120, matchMin: 20, start: "18:00", names: SAMPLE.slice(), pairs: [], rest: [], matches: [] };

  var $ = function (id) { return document.getElementById(id); };
  var fPeople = $("f-people"), fPairs = $("f-pairs"), fCourts = $("f-courts"), fPoints = $("f-points");
  var fTotal = $("f-total"), fMatch = $("f-match"), fStart = $("f-start");
  var nameList = $("name-list"), results = $("results"), note = $("note");

  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var d = JSON.parse(raw); if (d && d.names && d.matches) { for (var k in d) S[k] = d[k]; $("names-hint").textContent = "Escribe el nombre de cada jugadora."; } }
    } catch (e) {}
  }
  function clamp(v, lo, hi, def) { v = parseInt(v, 10); if (isNaN(v)) return def; return Math.max(lo, Math.min(hi, v)); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function syncInputs() { fPeople.value = S.people; fPairs.value = S.pairsN; fCourts.value = S.courts; fPoints.value = S.points; fTotal.value = S.total; fMatch.value = S.matchMin; fStart.value = S.start; }
  function perRound() { return Math.max(1, Math.min(S.courts, Math.floor(S.pairsN / 2))); }
  function clock(min) { var h = Math.floor(min / 60) % 24, m = min % 60; return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m; }
  function startMin() { var p = (S.start || "18:00").split(":"); return (+p[0]) * 60 + (+p[1] || 0); }

  function renderNames() {
    var html = "";
    for (var i = 0; i < S.people; i++) {
      html += '<div class="name-row"><i>' + (i + 1) + '</i><input type="text" id="n-' + i + '" data-i="' + i + '" maxlength="24" placeholder="Jugadora ' + (i + 1) + '" value="' + esc(S.names[i] || "") + '" aria-label="Nombre de la jugadora ' + (i + 1) + '"></div>';
    }
    nameList.innerHTML = html;
  }

  function setPeople(n) {
    S.people = n;
    while (S.names.length < n) S.names.push("");
    S.pairsN = Math.max(2, Math.floor(n / 2));
    fPairs.value = S.pairsN; fPeople.value = n;
    renderNames(); checkNote();
  }

  function checkNote() {
    var msg = "";
    var maxPairs = Math.floor(S.people / 2);
    if (S.pairsN > maxPairs) msg = "Con " + S.people + " personas solo se pueden formar " + maxPairs + " parejas.";
    else if (S.pairsN * 2 < S.people) msg = (S.people - S.pairsN * 2) + " jugadora(s) quedarán fuera de las parejas esta vez.";
    else if (S.courts > Math.floor(S.pairsN / 2)) msg = "Hay más canchas que partidos por ronda; algunas quedarán libres.";
    note.textContent = msg; note.hidden = !msg;
  }

  function generate(keepPairs) {
    var maxPairs = Math.floor(S.people / 2);
    S.pairsN = clamp(S.pairsN, 2, Math.max(2, maxPairs), 2);
    fPairs.value = S.pairsN;
    var names = [];
    for (var i = 0; i < S.people; i++) names.push((S.names[i] || "").trim() || "Jugadora " + (i + 1));
    var order = shuffle(names);
    var pairs = [];
    for (var p = 0; p < S.pairsN; p++) pairs.push({ id: p, a: order[p * 2], b: order[p * 2 + 1] });
    S.pairs = pairs;
    S.rest = order.slice(S.pairsN * 2);

    // Rondas parejas: cada ronda ocupa las mismas canchas, todas empiezan y terminan a la vez.
    var P = pairs.length, per = perRound();
    var totalAll = P * (P - 1) / 2;
    var maxRounds = Math.max(1, Math.floor(S.total / S.matchMin));
    var R = Math.min(maxRounds, Math.ceil(totalAll / per));
    var meet = {}, games = pairs.map(function () { return 0; });
    var matches = [];
    for (var r = 1; r <= R; r++) {
      var cand = [];
      for (var i2 = 0; i2 < P; i2++) for (var j2 = i2 + 1; j2 < P; j2++) {
        cand.push({ a: i2, b: j2, t: meet[i2 + "-" + j2] || 0, g: games[i2] + games[j2], rnd: Math.random() });
      }
      cand.sort(function (u, v) { return (u.t - v.t) || (u.g - v.g) || (u.rnd - v.rnd); });
      var busy = {}, chosen = [];
      for (var c = 0; c < cand.length && chosen.length < per; c++) {
        var m = cand[c];
        if (busy[m.a] || busy[m.b]) continue;
        busy[m.a] = busy[m.b] = 1; chosen.push(m);
      }
      chosen.forEach(function (m, idx) {
        meet[m.a + "-" + m.b] = (meet[m.a + "-" + m.b] || 0) + 1; games[m.a]++; games[m.b]++;
        matches.push({ id: matches.length, turn: r, court: idx + 1, a: m.a, b: m.b, sa: "", sb: "" });
      });
    }
    S.matches = matches;
    S.rounds = R; S.perRound = per; S.totalAll = totalAll;
    save(); renderResults();
  }

  function pairName(id) { var p = S.pairs[id]; return p.a + " & " + p.b; }

  function renderResults() {
    if (!S.matches.length) { results.innerHTML = '<div class="empty">Configura el grupo y pulsa «Generar reta».</div>'; return; }
    var h = '<section><div class="sec-title"><h2>Parejas</h2><small>' + S.pairs.length + ' parejas · ' + S.matches.length + ' partidos</small></div><div class="pairs">';
    S.pairs.forEach(function (p) { h += '<span class="chip"><b>' + (p.id + 1) + '</b>' + esc(p.a) + ' &amp; ' + esc(p.b) + '</span>'; });
    S.rest.forEach(function (r) { h += '<span class="chip rest">' + esc(r) + ' (descansa)</span>'; });
    var t0 = startMin(), end = t0 + S.rounds * S.matchMin;
    h += '</div></section><section><div class="sec-title"><h2>Rondas</h2><small>' + S.rounds + ' rondas · ' + S.perRound + (S.perRound === 1 ? ' partido' : ' partidos') + ' por ronda · ' + clock(t0) + ' a ' + clock(end) + ' (' + Math.floor((end - t0) / 60) + ' h ' + ((end - t0) % 60) + ' min)</small></div>';
    if (S.matches.length < S.totalAll) h += '<p class="note" style="margin-bottom:12px">En este tiempo se juegan ' + S.matches.length + ' de ' + S.totalAll + ' partidos posibles (todas contra todas). Sube la duración total o baja los minutos por partido para completar más.</p>';
    var turns = {};
    S.matches.forEach(function (m) { (turns[m.turn] = turns[m.turn] || []).push(m); });
    Object.keys(turns).forEach(function (t) {
      var ms = turns[t], playing = {};
      ms.forEach(function (m) { playing[m.a] = 1; playing[m.b] = 1; });
      var resting = S.pairs.filter(function (p) { return !playing[p.id]; }).map(function (p) { return p.id + 1; });
      var rs = t0 + (t - 1) * S.matchMin;
      h += '<div class="turn"><h3>Ronda ' + t + ' · ' + clock(rs) + ' a ' + clock(rs + S.matchMin) + (resting.length ? ' <em>Descansa: ' + (resting.length > 1 ? 'parejas ' : 'pareja ') + resting.join(", ") + '</em>' : '') + '</h3><div class="matches">';
      ms.forEach(function (m) {
        h += '<div class="match" id="m-' + m.id + '"><div class="court">Cancha ' + m.court + '</div>' + side(m, "a") + side(m, "b") + '</div>';
      });
      h += '</div></div>';
    });
    h += '</section><section><div class="sec-title"><h2>Tabla</h2><small>Ganados, luego diferencia de puntos</small></div><div class="table-scroll"><table><thead><tr><th>#</th><th>Pareja</th><th>PJ</th><th>G</th><th>P</th><th>PF</th><th>PC</th><th>Dif</th></tr></thead><tbody id="tbody"></tbody></table></div></section>';
    results.innerHTML = h;
    S.matches.forEach(markWinner);
    renderTable();
  }

  function side(m, w) {
    var id = w === "a" ? m.a : m.b, val = w === "a" ? m.sa : m.sb;
    return '<div class="side" id="s-' + m.id + w + '"><span>' + esc(pairName(id)) + '</span><input type="number" min="0" max="' + S.points + '" inputmode="numeric" id="sc-' + m.id + w + '" data-m="' + m.id + '" data-w="' + w + '" value="' + val + '" aria-label="Puntos de ' + esc(pairName(id)) + '"></div>';
  }

  function played(m) { return m.sa !== "" && m.sb !== "" && !isNaN(+m.sa) && !isNaN(+m.sb); }

  function markWinner(m) {
    var a = document.getElementById("s-" + m.id + "a"), b = document.getElementById("s-" + m.id + "b");
    if (!a || !b) return;
    a.classList.toggle("win", played(m) && +m.sa > +m.sb);
    b.classList.toggle("win", played(m) && +m.sb > +m.sa);
  }

  function renderTable() {
    var tb = document.getElementById("tbody"); if (!tb) return;
    var rows = S.pairs.map(function (p) { return { id: p.id, pj: 0, g: 0, pe: 0, pf: 0, pc: 0 }; });
    S.matches.forEach(function (m) {
      if (!played(m)) return;
      var a = rows[m.a], b = rows[m.b], x = +m.sa, y = +m.sb;
      a.pj++; b.pj++; a.pf += x; a.pc += y; b.pf += y; b.pc += x;
      if (x > y) { a.g++; b.pe++; } else if (y > x) { b.g++; a.pe++; }
    });
    rows.sort(function (u, v) { return (v.g - u.g) || ((v.pf - v.pc) - (u.pf - u.pc)) || (v.pf - u.pf) || (u.id - v.id); });
    var anyPlayed = rows.some(function (r) { return r.pj > 0; });
    tb.innerHTML = rows.map(function (r, i) {
      var d = r.pf - r.pc;
      return '<tr' + (i === 0 && anyPlayed ? ' class="lead-row"' : '') + '><td class="pos">' + (i + 1) + '</td><td>' + esc(pairName(r.id)) + '</td><td>' + r.pj + '</td><td>' + r.g + '</td><td>' + r.pe + '</td><td>' + r.pf + '</td><td>' + r.pc + '</td><td>' + (d > 0 ? "+" : "") + d + '</td></tr>';
    }).join("");
  }

  // Eventos
  fPeople.addEventListener("change", function () { setPeople(clamp(fPeople.value, 2, 40, S.people)); });
  fPairs.addEventListener("change", function () { S.pairsN = clamp(fPairs.value, 2, 20, S.pairsN); fPairs.value = S.pairsN; checkNote(); });
  fCourts.addEventListener("change", function () { S.courts = clamp(fCourts.value, 1, 10, S.courts); fCourts.value = S.courts; checkNote(); });
  fTotal.addEventListener("change", function () { S.total = clamp(fTotal.value, 20, 360, S.total); fTotal.value = S.total; save(); });
  fMatch.addEventListener("change", function () { S.matchMin = clamp(fMatch.value, 5, 90, S.matchMin); fMatch.value = S.matchMin; save(); });
  fStart.addEventListener("change", function () { S.start = fStart.value || "18:00"; save(); if (S.matches.length) renderResults(); });
  fPoints.addEventListener("change", function () { S.points = clamp(fPoints.value, 1, 99, S.points); fPoints.value = S.points; save(); });
  nameList.addEventListener("input", function (e) { var i = e.target.getAttribute("data-i"); if (i !== null) { S.names[+i] = e.target.value; save(); } });
  results.addEventListener("input", function (e) {
    var t = e.target, mi = t.getAttribute("data-m"); if (mi === null) return;
    var m = S.matches[+mi]; m["s" + t.getAttribute("data-w")] = t.value;
    markWinner(m); renderTable(); save();
  });
  $("b-gen").addEventListener("click", function () { generate(); });
  $("b-shuffle").addEventListener("click", function () { generate(); });
  $("b-clear").addEventListener("click", function () {
    S.matches.forEach(function (m) { m.sa = ""; m.sb = ""; });
    save(); renderResults();
  });

  load();
  syncInputs(); renderNames(); checkNote();
  if (S.matches.length && S.rounds) renderResults(); else generate();
})();
</script>
